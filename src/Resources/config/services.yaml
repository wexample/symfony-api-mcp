services:
    _defaults:
        autowire: true
        autoconfigure: true

    # The MCP server's page, beside the api's (symfony-api), and the button
    # leading to it.
    Wexample\SymfonyApiMcp\Controller\:
        resource: '../../Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyApiMcp\Service\McpDocumentationService: ~

    # The api's actions marked #[McpToolRoute] served as tools: a loader the
    # MCP bundle runs as it fills the registry (autoconfigured, `mcp.loader`).
    Wexample\SymfonyApiMcp\Service\ApiRouteToolLoader: ~
